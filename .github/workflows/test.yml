name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Reproduce cached audit without site packages
        run: |
          python -S scripts/audit_decisions.py --input demo/inputs.json --output runs/ci
          cmp demo/report.json runs/ci/report.json
      - name: Reproduce completed trajectory study
        run: |
          python -S scripts/summarize_trajectory_study.py --input docs/data/trajectory_study.json --output runs/trajectory
          cmp docs/data/trajectory_summary.json runs/trajectory/summary.json
          cmp docs/data/trajectory_readouts.csv runs/trajectory/records.csv
          cmp docs/data/trajectory_controls.csv runs/trajectory/controls.csv
